<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anato Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4ef;--ink:#14212b;--card:#fff;--mute:#5d6b73;--ac:#0e7c66;--red:#d63c4d;--line:#d3dbd4;--okbg:#d9f2e8;--nobg:#fbdfe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1922;--ink:#e6eee9;--card:#152833;--mute:#8fa3ab;--ac:#3fd1a8;--red:#ff6b7a;--line:#254250;--okbg:#12433a;--nobg:#4a2029}}
:root[data-theme="dark"]{--bg:#0d1922;--ink:#e6eee9;--card:#152833;--mute:#8fa3ab;--ac:#3fd1a8;--red:#ff6b7a;--line:#254250;--okbg:#12433a;--nobg:#4a2029}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:800 28px Fraunces,Georgia,serif;margin:4px 0 12px}
.hud{display:flex;gap:8px;margin-bottom:12px}
.hud div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mute)}
.hud b{display:block;font-size:20px;color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.modes{display:flex;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.modes button{flex:1;padding:9px;border:0;background:var(--card)}
.modes button.on{background:var(--ink);color:var(--bg);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:150px;font:600 20px/1.35 Fraunces,Georgia,serif;display:flex;flex-direction:column;justify-content:center}
.q small{font:13px system-ui;color:var(--mute);margin-bottom:8px}
.q.flip{border-color:var(--ac);border-width:2px}
.ans{color:var(--ac)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.opt.ok{background:var(--okbg);border-color:var(--ac)}.opt.no{background:var(--nobg);border-color:var(--red)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.r{color:var(--red)}
.end{text-align:center;padding:24px 8px}.end h2{font:800 26px Fraunces,Georgia,serif}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:10px}
</style></head><body><main>
<h1>Anato Arena</h1>
<div class="hud"><div>XP<b id="xp">0</b></div><div>Racha<b id="st">0</b></div><div>Mejor racha<b id="bs">0</b></div></div>
<div class="tabs" id="tabs"></div>
<div class="modes"><button id="mc" class="on">Cartas</button><button id="mq">Quiz</button></div>
<div class="bar"><i id="pr" style="width:0"></i></div>
<div id="game"></div>
</main>
<script>
const T=[
["Salud pública",[
["Modelo de Lalonde: ¿quién lo creó y cuándo?","Marc Lalonde, Ministro de Salud de Canadá, en 1974"],
["Los 4 componentes del campo de salud de Lalonde","Estilo de vida, medio ambiente, biología humana y sistema sanitario"],
["Estilo de vida (Lalonde)","Decisiones y hábitos personales: alimentación, ejercicio, tabaco, alcohol"],
["Medio ambiente (Lalonde)","Factores externos físicos, químicos, biológicos y psicosociales"],
["Biología humana (Lalonde)","Herencia genética, maduración y envejecimiento"],
["Sistema sanitario (Lalonde)","Cantidad, calidad, tipo y acceso a los servicios de salud"],
["Idea clave del modelo de Lalonde","La salud no depende solo de la atención médica"],
["Endemia","Presencia constante o prevalencia habitual de una enfermedad en un área geográfica"],
["Tríada ecológica","Agente, huésped y ambiente"],
["Prevención primaria","Evitar que la enfermedad aparezca (promoción y protección)"],
["Prevención secundaria","Diagnóstico y tratamiento tempranos"],
["Prevención terciaria","Rehabilitación y limitación de secuelas"],
["Vector del dengue y de la fiebre amarilla","Mosquito Aedes aegypti"],
["¿Cuántos ODS tiene la Agenda 2030?","17"],
["Dimensiones del desarrollo sustentable","Social, ambiental y económica"]]],
["Anatomía general",[
["Posición anatómica","De pie, mirando al frente, brazos a los lados y palmas hacia adelante"],
["Plano sagital","Divide el cuerpo en derecha e izquierda"],
["Plano coronal (frontal)","Divide el cuerpo en anterior y posterior"],
["Plano transversal (axial)","Divide el cuerpo en superior e inferior"],
["Articulación","Punto donde se unen dos o más piezas del esqueleto"],
["Sinartrosis","Articulación fibrosa, casi inmóvil (ej. suturas del cráneo)"],
["Anfiartrosis","Articulación cartilaginosa, semimóvil (ej. sínfisis del pubis)"],
["Diartrosis","Articulación sinovial, muy móvil"],
["Enartrosis","Sinovial de cabeza esférica y multiaxial (hombro, cadera)"]]],
["Sistema muscular",[
["Músculos somáticos: ¿qué forman?","Musculatura de tórax, abdomen, extremidades y cabeza (derivan de somitas)"],
["Músculos viscerales","Los de las vísceras: estómago, intestino, vasos sanguíneos"],
["Músculos branquioméricos","Derivan de los arcos faríngeos (ej. trapecio, esternocleidomastoideo)"],
["Músculo esquelético: fibra","Alargada, multinucleada, núcleos periféricos (excéntricos), estriada, voluntaria"],
["Músculo liso: fibra","Delgada, uninucleada con núcleo central, sin estrías, involuntaria"],
["Músculo cardiaco: fibra","Ramificada y corta, un núcleo central, con discos intercalares, involuntaria"],
["¿Para qué sirven los discos intercalares?","Garantizan que haya contracción sincronizada entre las fibras del corazón"],
["Músculos voluntarios vs involuntarios","Voluntario: esquelético. Involuntario: liso y cardiaco"],
["Músculo fusiforme","Nace y termina en tendón; en extremidades (bíceps, tríceps)"],
["Músculo esfínter (circular)","Disposición concéntrica alrededor de un hueco; abre o cierra (boca, ojo, ano)"],
["Músculo transverso vs oblicuo vs recto","Transverso: cruza la línea media. Oblicuo: torcido. Recto: paralelo a ella"],
["Músculo unipinnado","Fibras a un solo lado del eje del tendón"],
["Músculo bipinnado","Fibras a ambos lados del eje del tendón"],
["Músculo multipinnado / convergente","Multi: fibras en varios lados del eje. Convergente: fibras en abanico (pectoral, deltoides)"],
["Músculos sinergistas","Trabajan juntos para el mismo movimiento"],
["Músculos antagonistas","Producen movimientos opuestos"],
["Origen vs inserción","Origen: proximal, punto menos móvil. Inserción: distal, punto más móvil"]]],
["Sistema nervioso",[
["SNC","Encéfalo y médula espinal"],
["SNP","Nervios craneales y espinales, con sus ganglios"],
["Divisiones funcionales del SNP","Somático (voluntario) y autónomo (simpático y parasimpático)"],
["Sustancia gris","Cuerpos de las neuronas"],
["Sustancia blanca","Tractos de fibras que interconectan (axones mielinizados)"],
["Meninges de afuera hacia adentro","Duramadre, aracnoides y piamadre"],
["¿Dónde está el LCR?","Entre la piamadre y la aracnoides (espacio subaracnoideo)"],
["Espacio epidural","Entre la duramadre y la columna vertebral; lleno de tejido adiposo"],
["Astas posteriores (dorsales) de la médula","Sensitivas"],
["Astas anteriores (ventrales) de la médula","Motoras"],
["Función principal del SNC","Integrar y coordinar señales de entrada y salida; funciones superiores (pensamiento, aprendizaje)"]]],
["Angiología",[
["Angiología","Estudio de los vasos sanguíneos"],
["Arterias","Llevan la sangre fuera del corazón"],
["Venas","Regresan la sangre al corazón"],
["Circulación menor (pulmonar): ruta","Ventrículo derecho → arterias pulmonares → alvéolos → venas pulmonares → aurícula izquierda"],
["Circulación mayor (sistémica): ruta","Ventrículo izquierdo → aorta → tejidos → venas cavas → aurícula derecha"],
["¿A dónde llegan las venas cavas?","Aurícula derecha"],
["¿Dónde ocurre el intercambio gaseoso pulmonar?","En los alvéolos (hematosis)"],
["En los alvéolos, la sangre...","Suelta CO2 y toma O2"],
["pH arterial normal","7.35 a 7.45"],
["PCO2 arterial normal","35 a 45 mmHg"]]],
["Embriología",[
["Gametogénesis","Formación de gametos (espermatogénesis y ovogénesis) mediante meiosis"],
["Células germinales primordiales: aparición","3ª semana, en la pared del saco vitelino"],
["Células germinales primordiales: migración","4ª semana migran; en la 5ª llegan a la cresta gonadal"],
["¿Cuándo inicia la espermatogénesis?","En la pubertad"],
["Espermiogénesis","Espermátida se transforma en espermatozoide (maduración, sin dividirse)"],
["¿Qué aporta la meiosis?","Reduce los cromosomas a la mitad y da variabilidad genética"],
["Volumen normal de una eyaculación","2 a 5 mL"],
["Vesículas seminales: aporte al semen","Aprox. 60% del volumen; fructosa"],
["Próstata: aporte al semen","Aprox. 30% del volumen; citrato y enzimas"],
["pH del semen","Alcalino, 7.2 a 8"],
["Teratozoospermia","Malformaciones en los espermatozoides (cabeza o cola)"],
["Ovogénesis prenatal","Se forman ovocitos primarios antes del nacimiento, detenidos hasta la pubertad"],
["Organogénesis","Periodo embrionario, hasta la semana 8"]]]
];
const $=s=>document.querySelector(s);
let topic=-1,mode="c",deck=[],i=0,xp=0,st=0,bs=0,miss=[],ok=0,flip=false;
const pool=()=>topic<0?T.flatMap(t=>t[1]):T[topic][1];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function hud(){$("#xp").textContent=xp;$("#st").textContent=st;$("#bs").textContent=bs}
function tabs(){const n=["Todo",...T.map(t=>t[0])];$("#tabs").innerHTML=n.map((x,k)=>`<button class="tab ${k-1===topic?"on":""}" data-k="${k-1}">${x}</button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{topic=+b.dataset.k;start()})}
function start(list){deck=shuf(list||pool());i=0;miss=[];ok=0;flip=false;tabs();$("#mc").className=mode==="c"?"on":"";$("#mq").className=mode==="q"?"on":"";render()}
function render(){$("#pr").style.width=(i/deck.length*100)+"%";hud();if(i>=deck.length)return end();mode==="c"?card():quiz()}
function card(){const c=deck[i];$("#game").innerHTML=`<div class="q ${flip?"flip":""}" id="cd"><small>${i+1} de ${deck.length} · toca para ver la respuesta</small>${flip?`<span class="ans">${c[1]}</span>`:c[0]}</div>${flip?`<div class="row"><button class="btn r" id="no">Repasar</button><button class="btn p" id="si">Ya la sé</button></div>`:`<p class="hint">Piensa la respuesta antes de voltear</p>`}`;
 $("#cd").onclick=()=>{if(!flip){flip=true;card()}};
 if(flip){$("#no").onclick=()=>{miss.push(c);st=0;next()};$("#si").onclick=()=>{ok++;xp+=5;st++;bs=Math.max(bs,st);next()}}}
function next(){i++;flip=false;render()}
function quiz(){const c=deck[i];const others=shuf(pool().length>=4?pool():T.flatMap(t=>t[1])).filter(x=>x[1]!==c[1]).slice(0,3);
 const o=shuf([c,...others]);
 $("#game").innerHTML=`<div class="q"><small>${i+1} de ${deck.length}</small>${c[0]}</div><div class="opts">${o.map((x,k)=>`<button class="opt" data-k="${k}">${x[1]}</button>`).join("")}</div><div id="fb"></div>`;
 let done=false;
 document.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>{if(done)return;done=true;const right=o[k][1]===c[1];
  document.querySelectorAll(".opt").forEach((e,j)=>{if(o[j][1]===c[1])e.classList.add("ok")});
  if(right){ok++;st++;bs=Math.max(bs,st);xp+=10+Math.min(st,5)*2}else{b.classList.add("no");st=0;miss.push(c)}
  hud();$("#fb").innerHTML=`<div class="row"><button class="btn p" id="nx">${right?"Correcto, sigue":"Sigue"}</button></div>`;$("#nx").onclick=()=>{i++;render()}})}
function end(){const pct=Math.round(ok/deck.length*100);
 $("#game").innerHTML=`<div class="end"><h2>${pct>=80?"Dominado":pct>=50?"Vas bien":"A repasar"}: ${ok}/${deck.length}</h2><p>${xp} XP acumulados</p><div class="row">${miss.length?`<button class="btn r" id="rp">Repasar falladas (${miss.length})</button>`:""}<button class="btn p" id="ot">Otra ronda</button></div></div>`;
 if(miss.length)$("#rp").onclick=()=>start(miss.slice());$("#ot").onclick=()=>start()}
$("#mc").onclick=()=>{mode="c";start()};$("#mq").onclick=()=>{mode="q";start()};
start();
</script></body></html>
